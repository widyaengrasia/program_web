<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Website Pendaftaran Mahasiswa</title>
</head>

<body>

    <h1>Website Pendaftaran Mahasiswa</h1>

    <ul>
        <li><a href="#">Beranda</a></li>
        <li><a href="#">Profil</a></li>
        <li><a href="#">Pendaftaran</a></li>
    </ul>

    <h2>Form Pendaftaran</h2>

    <form>

        Nama :
        <input type="text" name="nama" placeholder="masukan nama anda">
        <br>

        Email :
        <input type="email" name="email" placeholder="masukan email anda">
        <br>

        Password :
        <input type="password" name="password" placeholder="masukan pass anda">
        <br>

        Tanggal Lahir :
        <input type="date" name="tanggal_lahir">
        <br>

        Umur :
        <input type="number" name="umur">
        <br>

        Upload :
        <input type="file" name="upload">
        <br>

        Gender :
        <input type="radio" name="gender" value="perempuan">Perempuan
        <input type="radio" name="gender" value="laki-laki">Laki-laki
        <br>

        Hobi :
        <select name="hobi">
            <option>---HOBI---</option>
            <option>Traveling</option>
            <option>Shopping</option>
            <option>Membaca</option>
            <option>Musik</option>
        </select>

        <br>

        Alamat :
        <textarea name="alamat" placeholder="masukan alamat"></textarea>

        <br>

        <button type="submit">Simpan</button>

    </form>

    <p>© 2026 Website Pendaftaran</p>

</body>

</html>
